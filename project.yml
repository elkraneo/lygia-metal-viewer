name: LygiaViewer

options:
  bundleIdPrefix: io.210x7
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
    visionOS: "2.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LygiaViewer:
    type: application
    # One multiplatform target: SwiftUI shaders run the same on all three.
    supportedDestinations: [macOS, iOS, visionOS]
    platform: auto
    sources:
      - path: LygiaViewer
        excludes:
          - "Resources/Info.plist"
    configFiles:
      Debug: Config/Viewer.xcconfig
      Release: Config/Viewer.xcconfig
    settings:
      base:
        PRODUCT_NAME: LygiaViewer
        PRODUCT_BUNDLE_IDENTIFIER: io.210x7.LygiaViewer
        # Signing comes from Config/Viewer.xcconfig (ad-hoc by default), which
        # Config/Local.xcconfig can override for device builds. Set here so it
        # also overrides xcodegen's "iPhone Developer" preset.
        CODE_SIGN_STYLE: $(VIEWER_CODE_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(VIEWER_CODE_SIGN_IDENTITY)
        DEVELOPMENT_TEAM: $(VIEWER_DEVELOPMENT_TEAM)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: LygiaViewer/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: LYGIA Viewer
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # visionOS immersive space: ARKit world tracking supplies the head pose.
        "INFOPLIST_KEY_NSWorldSensingUsageDescription[sdk=xr*]": "LYGIA Viewer uses your head position to render its immersive Metal scene."
        "INFOPLIST_KEY_UIApplicationSupportsMultipleScenes[sdk=xr*]": YES
        TARGETED_DEVICE_FAMILY: "1,2,7"

        # LYGIA_SOURCE_ROOT (the folder that contains `lygia/`) comes from
        # Config/Viewer.xcconfig. .metal files use `#include "lygia/sdf/starSDF.msl"`.
        MTL_HEADER_SEARCH_PATHS: $(LYGIA_SOURCE_ROOT) $(SRCROOT)/LygiaViewer/Shaders
        # LYGIA headers define many overloads; each demo only uses a few.
        MTL_COMPILER_FLAGS: -Wno-unused-function

        # The macOS Playground reads LYGIA from disk at runtime, so no App Sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    preBuildScripts:
      - name: Export upstream LYGIA main (for the Compare view)
        basedOnDependencyAnalysis: false
        # Export upstream main's .msl files from the submodule (adding an
        # `upstream` remote if needed), so the app can compile snippets against
        # them without git at runtime. Offline, an older export is kept.
        script: |
          SUB="${SRCROOT}/External/lygia"
          DEST="${LYGIA_UPSTREAM_ROOT}/lygia"
          git -C "$SUB" remote get-url upstream >/dev/null 2>&1 || git -C "$SUB" remote add upstream https://github.com/patriciogonzalezvivo/lygia.git
          git -C "$SUB" fetch -q upstream main 2>/dev/null || true
          REF=$(git -C "$SUB" rev-parse upstream/main 2>/dev/null) || { echo "warning: upstream/main not available in $SUB; Compare will show upstream as missing"; exit 0; }
          if [ "$(cat "$DEST/.exported" 2>/dev/null)" = "$REF" ]; then exit 0; fi
          rm -rf "$DEST" && mkdir -p "$DEST"
          git -C "$SUB" archive "$REF" -- ':(glob)**/*.msl' | tar -x -C "$DEST"
          echo "$REF" > "$DEST/.exported"
    postBuildScripts:
      - name: Copy shader sources (for the in-app source view)
        basedOnDependencyAnalysis: false
        script: |
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ShaderSources"
          mkdir -p "$DEST"
          find "${SRCROOT}/LygiaViewer/Shaders" \( -name '*.metal' -o -name '*.h' \) -exec cp {} "$DEST/" \;

schemes:
  LygiaViewer:
    build:
      targets:
        LygiaViewer: all
    run:
      config: Debug
